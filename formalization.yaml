# formalization.yaml v0.4
version: "v0.4"

project:
  name: "A local T(b) theorem for perfect multilinear Calderón–Zygmund operators (Mirek–Thiele), formalized in Lean 4"
  description: >-
    A complete Lean 4 / Mathlib formalization of the three main theorems of M. Mirek and
    C. Thiele, "A local T(b) theorem for perfect multilinear Calderón–Zygmund operators",
    Proc. London Math. Soc. 114 (2017): the perfect multilinear local T(1) theorem
    (Theorem 1.3), the perfect multilinear local T(b) theorem with general testing functions
    on admissible collections of paths (Theorem 1.4), and the perfect multilinear global T(b)
    theorem (Theorem 1.11), for n-linear forms on dyadic test functions in R^d satisfying the
    dyadic decay, perfect smoothness and qualitative truncation conditions. The development
    follows the paper's proof of Theorem 1.4 (stopping times, pruning, the telescoping
    identities, the discrete Carleson embedding and the outer-measure Hölder inequalities of
    Do–Thiele, the contraction step and its iteration) and the global/local reduction of
    Theorem 1.11, including the atom estimate for the dyadic Hardy norm for all exponents
    (Burkholder's L^p bound for the dyadic square function by Marcinkiewicz interpolation).
    Theorem 1.3, cited as folklore in the paper, is proved by a dyadic paraproduct argument
    with a dyadic John–Nirenberg inequality for the paraproduct symbols. All constants
    depend only on the dimension, the linearity, the testing constant and the exponents.
  authors:
    - "Stefanos Lappas"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Stefanos Lappas"

